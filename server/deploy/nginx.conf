limit_req_zone $binary_remote_addr zone=ymc_general:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=ymc_login:10m rate=5r/m;
limit_conn_zone $server_name zone=ymc_uploads:1m;
limit_conn_zone $server_name zone=ymc_auth:1m;

server {
    listen 80;
    server_name api.nuc-ymc.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name api.nuc-ymc.com;
    ssl_certificate /etc/letsencrypt/live/api.nuc-ymc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.nuc-ymc.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    root /opt/nuc-ymc/web;
    index index.html;
    client_max_body_size 50m;
    client_body_timeout 30s;
    limit_req_status 429;
    limit_conn_status 429;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: https://nuc-ymc.com; media-src 'self' https://nuc-ymc.com; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    access_log off;
    location /api/auth/ {
        client_max_body_size 8k;
        limit_req zone=ymc_login burst=10 nodelay;
        limit_conn ymc_auth 2;
        include /etc/nginx/snippets/ymc-proxy.conf;
    }
    location = /api/works {
        limit_req zone=ymc_general burst=10 nodelay;
        limit_conn ymc_uploads 2;
        include /etc/nginx/snippets/ymc-proxy.conf;
    }
    location ~ ^/api/works/[^/]+/revision$ {
        limit_req zone=ymc_general burst=10 nodelay;
        limit_conn ymc_uploads 2;
        include /etc/nginx/snippets/ymc-proxy.conf;
    }
    location /api/ {
        limit_req zone=ymc_general burst=30 nodelay;
        include /etc/nginx/snippets/ymc-proxy.conf;
    }
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
    location ~ /\. { deny all; }
}
